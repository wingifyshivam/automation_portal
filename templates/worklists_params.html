{% extends "base.html" %}
{% block title %}{{ automation_name }}{% endblock %}
{% block content %}

<div class="card-params">
    <h1>⚙ {{ automation_name }}</h1>
    <!--<p class="subtitle">Configure and run this automation</p>-->

    <form method="POST" onsubmit="return showLoading()">

        <!-- Environment -->
        <div class="form-group">
            <label for="client">Environment</label>

            <select name="client" id="client" required>
                <option value="" disabled selected>
                    Select environment
                </option>

                <optgroup label="Newmedica">
                    <option>Newmedica Live</option>
                    <option>Newmedica UAT</option>
                </optgroup>
            </select>

            <small>Select where this automation will run</small>
        </div>

        <div class="form-group">
            <label for="dashboard_set">Dashboard Set</label>

            <select name="dashboard_set" id="dashboard_set" required>
                <option value="" disabled selected>
                    Select the dashboard set
                </option>

                <option>ePR NHS</option>

            </select>

            <small>Select the dashboard set</small>
        </div>

        <div class="form-group">
            <label for="dashboard_workflow">Dashboard Workflow</label>

            <select name="dashboard_workflow" id="dashboard_workflow" required>
                <option value="" disabled selected>
                    Select the dashboard workflow
                </option>

                <option>Contact</option>

            </select>

            <small>Select the dashboard workflow</small>
        </div>

        <div class="form-group">
            <label for="dashboard_view">Dashboard View</label>

            <select name="dashboard_view" id="dashboard_view" required>
                <option value="" disabled selected>
                    Select the dashboard view
                </option>

                <option>Cataract to Book</option>
                <option>Cataract Surgery To Book</option>

            </select>

            <small>Select the dashboard view</small>
        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button type="submit" class="run-btn" id="runBtn">
                ▶ Run Automation
            </button>

            <a href="{{ url_for('home') }}" class="link-btn">
                Home
            </a>

        </div>


        <!-- Loading -->
        <div id="loading">
            <div class="spinner"></div>
            <p>Running automation… Please wait</p>
        </div>

    </form>

</div>


<script>

function showLoading() {

    document.getElementById("loading").style.display = "block";

    // Disable button to prevent double submit
    document.getElementById("runBtn").disabled = true;

    return true;
}

</script>

{% endblock %}
